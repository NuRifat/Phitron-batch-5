<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <!-- It is a trick to avoid the browser’s “favicon not found” 404 error. -->
    <link rel="icon" href="data:,"> 
    <title>Rifat Restaurent</title>
</head>

<body>
    <header>
        <nav class="navbar navbar-light bg-light p-3">
            <div class="container-fluid justify-content-center">
                <form class="d-flex w-50">
                    <input class="form-control me-2" type="search" placeholder="Search" aria-label="Search">
                    <button class="btn btn-outline-success" type="submit">Search</button>
                </form>
            </div>
        </nav>
    </header>
    <main class="container my-4">
        <div class="main-container row g-3">
            <div class="item-container col-9 p-3">
                <div id="meal-container" class="row g-3">
                    <!-- Content will be here via JS -->
                </div>
            </div>
            <div class="cart-conatiner col-3">
                <h3>Total cart items: <span id="cart-count">0</span></h3>
                <table class="table">
                    <thead>
                        <tr>
                            <th class="col">SL</th>
                            <th class="col">Img</th>
                            <th class="col">Name</th>
                        </tr>
                    </thead>
                    <tbody id="cart-body">
                        <!-- Content will be here via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>


    <!-- Modal -->
    <div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1"
        aria-labelledby="staticBackdropLabel" aria-hidden="true">
        <div class="modal-dialog" style="max-width: 450px; height: 500px;">
            <div class="modal-content" style="height: 105%;">
                <div class="modal-header">
                    <h6 class="modal-title" id="modal-title">
                        <!-- Content will be here via JS -->
                    </h6>
                    <button type="button" class="btn-close btn-sm" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <!-- Content will be here via JS -->
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
